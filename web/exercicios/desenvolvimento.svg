<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
<title id="titulo">Desenvolvimento — demonstração do movimento</title>
<style>
.corpo { animation: movimento 4s ease-in-out infinite; }
.cabeca { animation: cabeca 4s ease-in-out infinite; }
@keyframes movimento { 0%,100% { d:path('M 200 141 L 200 240 M 200 160 L 140 180 L 140 130 M 200 160 L 260 180 L 260 130 M 200 240 L 170 285 L 170 342 M 200 240 L 230 285 L 230 342'); } 50% { d:path('M 200 141 L 200 240 M 200 160 L 155 115 L 160 65 M 200 160 L 245 115 L 240 65 M 200 240 L 170 285 L 170 342 M 200 240 L 230 285 L 230 342'); } }
@keyframes cabeca { 0%,100% { transform:translate(0,0); } 50% { transform:translate(0px,0px); } }
.esq { animation: esquerda 4s ease-in-out infinite; } .dir { animation: direita 4s ease-in-out infinite; } @keyframes esquerda { 0%,100% {transform:translate(0,0);} 50% {transform:translate(20px,-65px);} } @keyframes direita {0%,100% {transform:translate(0,0);} 50% {transform:translate(-20px,-65px);} }
.equipamento { stroke:#9baab4; stroke-width:6; } .peso { stroke:#bd5b16; stroke-width:8; } .cabo {stroke:#9baab4;stroke-width:3;}
@media (prefers-reduced-motion: reduce) { .corpo,.cabeca,.peso,.cabo { animation-play-state:paused; } }
</style>
<rect width="400" height="400" fill="#f5f7f8"/>
<path d="M 50 350 H 350" fill="none" stroke="#c3ccd1" stroke-width="3"/>
<g fill="none" stroke="#193f50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
<path class="peso esq" d="M 125 130 H 155 M 125 122 V 138 M 155 122 V 138"/><path class="peso dir" d="M 245 130 H 275 M 245 122 V 138 M 275 122 V 138"/>
<path class="corpo" d="M 200 141 L 200 240 M 200 160 L 140 180 L 140 130 M 200 160 L 260 180 L 260 130 M 200 240 L 170 285 L 170 342 M 200 240 L 230 285 L 230 342"/>
<circle class="cabeca" cx="200" cy="115" r="20" fill="#e7b58d" stroke-width="5"/>
</g>
</svg>
