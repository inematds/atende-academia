<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
<title id="titulo">Remada — demonstração do movimento</title>
<style>
.corpo { animation: movimento 4s ease-in-out infinite; }
.cabeca { animation: cabeca 4s ease-in-out infinite; }
@keyframes movimento { 0%,100% { d:path('M 230 176 L 170 240 M 222 185 L 233 240 L 245 285 M 222 185 L 210 245 L 220 285 M 170 240 L 155 290 L 145 342 M 170 240 L 205 290 L 220 342'); } 50% { d:path('M 230 176 L 170 240 M 222 185 L 175 210 L 220 235 M 222 185 L 155 210 L 195 235 M 170 240 L 155 290 L 145 342 M 170 240 L 205 290 L 220 342'); } }
@keyframes cabeca { 0%,100% { transform:translate(0,0); } 50% { transform:translate(0px,0px); } }
.peso { animation: peso 4s ease-in-out infinite; } @keyframes peso { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-25px,-50px); } }
.equipamento { stroke:#9baab4; stroke-width:6; } .peso { stroke:#bd5b16; stroke-width:8; } .cabo {stroke:#9baab4;stroke-width:3;}
@media (prefers-reduced-motion: reduce) { .corpo,.cabeca,.peso,.cabo { animation-play-state:paused; } }
</style>
<rect width="400" height="400" fill="#f5f7f8"/>
<path d="M 50 350 H 350" fill="none" stroke="#c3ccd1" stroke-width="3"/>
<g fill="none" stroke="#193f50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
<g class="peso"><path d="M 210 285 H 255"/><path d="M 210 275 V 295 M 255 275 V 295"/></g>
<path class="corpo" d="M 230 176 L 170 240 M 222 185 L 233 240 L 245 285 M 222 185 L 210 245 L 220 285 M 170 240 L 155 290 L 145 342 M 170 240 L 205 290 L 220 342"/>
<circle class="cabeca" cx="250" cy="156" r="20" fill="#e7b58d" stroke-width="5"/>
</g>
</svg>
