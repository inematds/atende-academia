<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
<title id="titulo">Levantamento terra com bastão — demonstração do movimento</title>
<style>
.corpo { animation: movimento 4s ease-in-out infinite; }
.cabeca { animation: cabeca 4s ease-in-out infinite; }
@keyframes movimento { 0%,100% { d:path('M 200 120 L 200 230 M 200 145 L 220 195 L 225 245 M 200 145 L 190 195 L 195 245 M 200 230 L 180 285 L 175 342 M 200 230 L 220 285 L 225 342'); } 50% { d:path('M 245 212 L 165 248 M 235 218 L 230 260 L 225 305 M 235 218 L 200 260 L 195 305 M 165 248 L 190 285 L 175 342 M 165 248 L 235 285 L 225 342'); } }
@keyframes cabeca { 0%,100% { transform:translate(0,0); } 50% { transform:translate(70px,106px); } }
.peso { animation: peso 4s ease-in-out infinite; } @keyframes peso { 0%,100% { transform:translate(0,0); } 50% { transform:translateY(60px); } }
.equipamento { stroke:#9baab4; stroke-width:6; } .peso { stroke:#bd5b16; stroke-width:8; } .cabo {stroke:#9baab4;stroke-width:3;}
@media (prefers-reduced-motion: reduce) { .corpo,.cabeca,.peso,.cabo { animation-play-state:paused; } }
</style>
<rect width="400" height="400" fill="#f5f7f8"/>
<path d="M 50 350 H 350" fill="none" stroke="#c3ccd1" stroke-width="3"/>
<g fill="none" stroke="#193f50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
<path class="peso" d="M 150 245 H 270"/>
<path class="corpo" d="M 200 120 L 200 230 M 200 145 L 220 195 L 225 245 M 200 145 L 190 195 L 195 245 M 200 230 L 180 285 L 175 342 M 200 230 L 220 285 L 225 342"/>
<circle class="cabeca" cx="200" cy="94" r="20" fill="#e7b58d" stroke-width="5"/>
</g>
</svg>
