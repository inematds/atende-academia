<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
<title id="titulo">Flexão — demonstração do movimento</title>
<style>
.corpo { animation: movimento 4s ease-in-out infinite; }
.cabeca { animation: cabeca 4s ease-in-out infinite; }
@keyframes movimento { 0%,100% { d:path('M 135 222 L 275 275 M 145 226 L 138 280 L 125 340 M 145 226 L 175 280 L 165 340 M 275 275 L 310 310 L 335 340 M 275 275 L 295 310 L 320 340'); } 50% { d:path('M 135 277 L 275 303 M 145 279 L 190 310 L 125 340 M 145 279 L 210 310 L 165 340 M 275 303 L 310 322 L 335 340 M 275 303 L 295 322 L 320 340'); } }
@keyframes cabeca { 0%,100% { transform:translate(0,0); } 50% { transform:translate(0px,55px); } }
.equipamento { stroke:#9baab4; stroke-width:6; } .peso { stroke:#bd5b16; stroke-width:8; } .cabo {stroke:#9baab4;stroke-width:3;}
@media (prefers-reduced-motion: reduce) { .corpo,.cabeca,.peso,.cabo { animation-play-state:paused; } }
</style>
<rect width="400" height="400" fill="#f5f7f8"/>
<path d="M 50 350 H 350" fill="none" stroke="#c3ccd1" stroke-width="3"/>
<g fill="none" stroke="#193f50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

<path class="corpo" d="M 135 222 L 275 275 M 145 226 L 138 280 L 125 340 M 145 226 L 175 280 L 165 340 M 275 275 L 310 310 L 335 340 M 275 275 L 295 310 L 320 340"/>
<circle class="cabeca" cx="113" cy="210" r="20" fill="#e7b58d" stroke-width="5"/>
</g>
</svg>
