<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="titulo">
<title id="titulo">Agachamento — demonstração do movimento</title>
<style>
.corpo { animation: movimento 4s ease-in-out infinite; }
.cabeca { animation: cabeca 4s ease-in-out infinite; }
@keyframes movimento { 0%,100% { d:path('M 210 120 L 205 225 M 210 145 L 250 170 L 290 170 M 210 145 L 240 180 L 278 180 M 205 225 L 190 280 L 190 342 M 205 225 L 230 280 L 230 342'); } 50% { d:path('M 225 174 L 175 250 M 215 190 L 250 200 L 290 200 M 215 190 L 240 210 L 278 210 M 175 250 L 225 280 L 190 342 M 175 250 L 265 280 L 230 342'); } }
@keyframes cabeca { 0%,100% { transform:translate(0,0); } 50% { transform:translate(15px,54px); } }
.equipamento { stroke:#9baab4; stroke-width:6; } .peso { stroke:#bd5b16; stroke-width:8; } .cabo {stroke:#9baab4;stroke-width:3;}
@media (prefers-reduced-motion: reduce) { .corpo,.cabeca,.peso,.cabo { animation-play-state:paused; } }
</style>
<rect width="400" height="400" fill="#f5f7f8"/>
<path d="M 50 350 H 350" fill="none" stroke="#c3ccd1" stroke-width="3"/>
<g fill="none" stroke="#193f50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

<path class="corpo" d="M 210 120 L 205 225 M 210 145 L 250 170 L 290 170 M 210 145 L 240 180 L 278 180 M 205 225 L 190 280 L 190 342 M 205 225 L 230 280 L 230 342"/>
<circle class="cabeca" cx="210" cy="94" r="20" fill="#e7b58d" stroke-width="5"/>
</g>
</svg>
